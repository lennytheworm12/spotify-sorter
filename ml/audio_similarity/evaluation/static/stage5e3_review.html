<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Playlist compatibility review</title>
<style>body{font:16px system-ui;margin:2rem auto;max-width:880px;padding:0 1rem;background:#15191d;color:#eee}button,select,textarea{font:inherit;padding:.6rem;background:#252c32;color:#eee;border:1px solid #60717e;border-radius:5px}button{cursor:pointer}article{padding:1rem 0;border-top:1px solid #53606a}audio{width:100%;margin:.5rem 0}textarea{display:block;width:95%;margin:.5rem 0}#message{min-height:2rem}nav{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}small{color:#b8c4cc}button:disabled{opacity:.5}label{display:block;margin:.5rem 0}</style>
<h1>Playlist compatibility</h1><p id="question"></p><details open><summary>Rating guide</summary><div id="rubric"></div></details>
<p id="progress"></p><nav><button id="previous">Previous</button><button id="next">Next</button><button id="resume">Next unfinished</button></nav>
<p id="message" role="status" aria-live="polite"></p><main id="packet"></main><label>Revision reason (only when changing a submitted packet)<textarea id="reason" maxlength="2000"></textarea></label><button id="submit">Submit complete packet</button>
<script>
let offset=0,total=0,current=null,playback={},frozen=false;const sessionId=crypto.randomUUID();
const el=id=>document.getElementById(id);const text=(tag,value)=>{const n=document.createElement(tag);n.textContent=value;return n};
function player(track){const a=document.createElement('audio');a.controls=true;a.preload='metadata';a.src=track.audio_url;a.volume=1;let last=null;const key=track.spotify_track_id;playback[key]={track_id:key,played_seconds:0,seek_count:0};a.addEventListener('timeupdate',()=>{if(last!==null&&!a.seeking&&!a.paused){const delta=a.currentTime-last;if(delta>0&&delta<2)playback[key].played_seconds+=delta}last=a.currentTime});a.addEventListener('seeking',()=>{playback[key].seek_count++;last=null});return a}
async function load(){document.querySelectorAll('audio').forEach(a=>a.pause());const response=await fetch('/api/session?offset='+offset+'&limit=1');if(!response.ok)throw Error('Unable to load review');const data=await response.json();total=data.total;frozen=data.frozen;current=data.packets[0];el('question').textContent=data.question;el('rubric').replaceChildren(...Object.entries(data.rubric).map(([k,v])=>text('p',k+' — '+v)));el('progress').textContent=`Packet ${total?offset+1:0} of ${total} · ${data.submitted_packets} submitted`;el('packet').replaceChildren();playback={};el('reason').value='';el('submit').disabled=frozen||!current;el('previous').disabled=offset===0;el('next').disabled=offset+1>=total;if(!current){el('message').textContent='No pending review packets.';return}el('packet').append(text('h2',current.anchor.title+' — '+current.anchor.artists.join(', ')),player(current.anchor));const answers=Object.fromEntries(current.answers.map(a=>[a.pair_id,a]));for(const c of current.candidates){const article=document.createElement('article');article.dataset.pair=c.pair_id;article.append(text('h3',c.track.title+' — '+c.track.artists.join(', ')),player(c.track));const label=text('label','Your judgment');const select=document.createElement('select');select.setAttribute('aria-label','Your judgment for '+c.track.title);select.append(new Option('Choose…',''));for(const [k,v]of Object.entries(data.rubric))select.append(new Option(k+' — '+v,k));select.value=answers[c.pair_id]?.label||'';select.disabled=frozen;label.append(select);article.append(label);const note=document.createElement('textarea');note.placeholder='Optional note';note.setAttribute('aria-label','Note for '+c.track.title);note.maxLength=2000;note.value=answers[c.pair_id]?.note||'';note.disabled=frozen;article.append(note);el('packet').append(article)}el('message').textContent=frozen?'Review is frozen.':current.submitted?'Packet submitted. Changes require a revision reason.':'Listen and judge every candidate before submitting.'}
async function safely(fn){try{await fn()}catch(e){el('message').textContent=e.message}}
el('previous').onclick=()=>safely(async()=>{offset=Math.max(0,offset-1);await load()});el('next').onclick=()=>safely(async()=>{offset=Math.min(total-1,offset+1);await load()});el('resume').onclick=()=>safely(async()=>{const d=await(await fetch('/api/session?filter=unreviewed&limit=1')).json();if(!d.packets.length){el('message').textContent='Every packet has been submitted.';return}const target=d.packets[0].packet_id;for(let i=0;i<total;i++){const p=await(await fetch('/api/session?offset='+i+'&limit=1')).json();if(p.packets[0].packet_id===target){offset=i;break}}await load()});
el('submit').onclick=()=>safely(async()=>{const answers=[...document.querySelectorAll('article')].map(a=>({pair_id:a.dataset.pair,label:a.querySelector('select').value,note:a.querySelector('textarea').value}));if(answers.some(a=>!a.label))throw Error('Choose a judgment for every candidate.');const r=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({packet_id:current.packet_id,answers,revision_reason:el('reason').value,session_id:sessionId,playback:Object.values(playback)})});const d=await r.json();if(!r.ok)throw Error(d.error);await load();el('message').textContent='Complete packet saved.'});safely(load);
</script></html>
