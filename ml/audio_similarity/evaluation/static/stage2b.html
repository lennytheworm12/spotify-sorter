<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stage 2B Overall Similarity</title>
<style>
:root{color-scheme:dark;--bg:#0b0e0d;--panel:#141917;--line:#29322e;--text:#f1f5f3;--muted:#9aa8a1;--green:#1ed760;--green2:#0fa64a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#1d3026 0,var(--bg) 42%);color:var(--text);font:16px/1.45 system-ui,sans-serif;min-height:100vh}.shell{width:min(820px,calc(100% - 28px));margin:0 auto;padding:28px 0 60px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}h1{font-size:clamp(25px,4vw,38px);line-height:1.05;margin:0 0 7px}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.muted{color:var(--muted)}.rater{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.rater label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.rater input{width:190px;background:#090c0b;color:var(--text);border:1px solid #3a4640;border-radius:8px;padding:9px}.card{background:rgba(20,25,23,.96);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,34px);box-shadow:0 18px 60px #0008}.status{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:22px}.question{text-align:center;font-size:20px;font-weight:700;margin:18px auto 28px;max-width:520px}.players{display:grid;grid-template-columns:1fr 1fr;gap:12px}.play{border:1px solid #344039;background:#0e1311;color:var(--text);border-radius:14px;padding:18px 12px;font-weight:750;cursor:pointer}.play.query{grid-column:1/-1;border-color:#4b5c53}.play:hover,.play:focus-visible{border-color:var(--green);outline:none}.play.playing{background:#163a24;border-color:var(--green)}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:26px}.choice{background:#202823;color:var(--text);border:1px solid #38443e;border-radius:10px;padding:13px 6px;font-weight:700;cursor:pointer}.choice:hover,.choice:focus-visible,.choice.selected{background:var(--green2);border-color:var(--green);outline:none}.note{width:100%;margin-top:14px;background:#0c100e;border:1px solid #303a35;border-radius:10px;color:var(--text);padding:11px;resize:vertical}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.nav button{background:transparent;color:var(--text);border:1px solid #3a4640;border-radius:9px;padding:9px 14px;cursor:pointer}.message{min-height:24px;color:var(--green);text-align:center;margin-top:14px}.empty{text-align:center;padding:60px 10px}.hidden{display:none}@media(max-width:620px){header{display:block}.rater{margin-top:16px}.rater input{width:100%}.choices{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><main class="shell">
<header><div><div class="eyebrow">Blinded listening benchmark</div><h1>Overall song similarity</h1><div class="muted">The same centered five-second evidence is used for every clip.</div></div><div class="rater"><label for="rater">Rater ID (required)</label><input id="rater" autocomplete="name" placeholder="your stable ID"></div></header>
<section class="card" id="card"><div class="status"><span id="progress">Enter a rater ID to begin</span><span id="count"></span></div><div id="content" class="empty muted">Your identity separates independent judgments. Titles, artists, genres, model sources, and scores remain hidden.</div></section>
</main>
<script>
const rater=document.querySelector('#rater'),content=document.querySelector('#content'),progress=document.querySelector('#progress'),count=document.querySelector('#count');
let session=null,index=0,audioContext=null,source=null,currentButton=null;
rater.value=localStorage.getItem('stage2b-rater')||'';
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const id=rater.value.trim();if(!id){session=null;render();return}localStorage.setItem('stage2b-rater',id);const response=await fetch('/api/session?rater_id='+encodeURIComponent(id));const data=await response.json();if(!response.ok)throw Error(data.error||'Session failed');session=data;const next=session.trials.findIndex(t=>t.needs_rating_by_current_reviewer);index=next<0?0:next;render()}
function render(){if(!session){progress.textContent='Enter a rater ID to begin';count.textContent='';content.className='empty muted';content.textContent='Your identity separates independent judgments. Titles, artists, genres, model sources, and scores remain hidden.';return}progress.textContent=session.progress.needs_rating+' judgments currently needed from you';if(!session.trials.length){content.textContent='No trials available.';return}const t=session.trials[index];count.textContent=(index+1)+' / '+session.trials.length;content.className='';content.innerHTML=`<div class="question">${escapeHtml(t.question)}</div><div class="players"><button class="play query" data-url="${t.query_audio}">▶ Play query</button><button class="play" data-url="${t.a_audio}">▶ Play candidate A</button><button class="play" data-url="${t.b_audio}">▶ Play candidate B</button></div><div class="choices">${session.choices.map(c=>`<button class="choice ${t.current_reviewer.choice===c?'selected':''}" data-choice="${c}">${c}</button>`).join('')}</div><textarea class="note" rows="2" maxlength="2000" placeholder="Optional blinded note">${escapeHtml(t.current_reviewer.note)}</textarea><div class="message" aria-live="polite">${t.needs_rating_by_current_reviewer?'':'Your judgment is saved; this item is not shown as needing work.'}</div><div class="nav"><button id="prev">← Previous</button><span class="muted">${t.aggregate_count} independent rater${t.aggregate_count===1?'':'s'}</span><button id="next">Next →</button></div>`;content.querySelectorAll('.play').forEach(b=>b.onclick=()=>play(b));content.querySelectorAll('.choice').forEach(b=>b.onclick=()=>save(t,b.dataset.choice));content.querySelector('#prev').onclick=()=>{index=(index-1+session.trials.length)%session.trials.length;render()};content.querySelector('#next').onclick=()=>{index=(index+1)%session.trials.length;render()}}
async function play(button){if(source){const same=currentButton===button;source.onended=null;try{source.stop()}catch{}source=null;if(currentButton)currentButton.classList.remove('playing');currentButton=null;if(same)return}audioContext=audioContext||new AudioContext({sampleRate:24000});const response=await fetch(button.dataset.url);if(!response.ok)throw Error('Audio failed');const bytes=await response.arrayBuffer();const view=new DataView(bytes),samples=new Float32Array(bytes.byteLength/4);for(let i=0;i<samples.length;i++)samples[i]=view.getFloat32(i*4,true);const buffer=audioContext.createBuffer(1,samples.length,24000);buffer.copyToChannel(samples,0);const playing=audioContext.createBufferSource();source=playing;currentButton=button;playing.buffer=buffer;playing.connect(audioContext.destination);document.querySelectorAll('.play').forEach(b=>b.classList.remove('playing'));button.classList.add('playing');playing.onended=()=>{if(source===playing){source=null;currentButton=null}button.classList.remove('playing')};playing.start()}
async function save(t,choice){const note=content.querySelector('.note').value;const response=await fetch('/api/rate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({trial_id:t.trial_id,rater_id:rater.value,choice,note})});const data=await response.json();if(!response.ok){content.querySelector('.message').textContent=data.error||'Save failed';return}await load();content.querySelector('.message').textContent='Saved automatically.'}
let timer;rater.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>load().catch(e=>{content.textContent=e.message}),350)});load().catch(e=>{content.textContent=e.message});
</script></body></html>
