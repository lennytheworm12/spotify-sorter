<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Song-by-song playlist review</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font:14px/1.5 system-ui}header,main{max-width:1180px;margin:auto;padding:12px 18px}header{border-bottom:1px solid #30363d}h1{font-size:17px;margin:0}header p{font-size:12px;margin:5px 0}h2{font-size:15px;margin:0}button,select,textarea{font:inherit;color:inherit;background:#21262d;border:1px solid #596574;border-radius:6px;padding:7px 9px}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}button[aria-pressed=true]{background:#215d9c;border-color:#79b8ff}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #79b8ff;outline-offset:2px}nav{display:flex;align-items:center;gap:7px;flex-wrap:wrap}select{max-width:420px;min-width:0}.muted{color:#a4afbd}#progress{margin-top:8px;font-size:12px}#status{min-height:24px;font-size:12px}#list{margin-top:10px}.query,article{border:1px solid #30363d;border-radius:8px}.query{display:grid;grid-template-columns:1fr 360px;padding:10px 12px;gap:12px;align-items:center}.query small{font-size:11px}.query audio{width:100%;height:34px}article{display:grid;grid-template-columns:minmax(180px,1fr) 76px minmax(340px,auto);align-items:center;gap:10px;padding:8px 13px;margin-bottom:7px;min-height:64px}.artists{font-size:12px;color:#a4afbd}.ratings{display:flex;gap:5px;flex-wrap:wrap}.ratings button{min-width:30px;padding:5px 8px}article textarea{grid-column:1/-1;width:100%;min-height:52px}#player{display:flex;align-items:center;gap:12px;border:1px solid #58a6ff;padding:8px 12px;border-radius:8px;margin-top:10px}#player[hidden],textarea[hidden]{display:none}#player audio{width:380px;height:34px}#playing{flex:1;font-size:13px}.sticky{position:sticky;top:0;background:#0d1117;padding:8px 0;z-index:1}footer{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:12px 0;border-top:1px solid #30363d}#submit{background:#215d9c;border-color:#58a6ff}#reason-label{width:100%;font-size:12px}#reason{display:block;width:100%;margin-top:5px}details{font-size:12px;margin:6px 0}details p{margin:3px 0}@media(max-width:760px){article{grid-template-columns:1fr 76px}.ratings{grid-column:1/-1}.query{grid-template-columns:1fr}.query audio{max-width:100%}#player{flex-wrap:wrap}#player audio{width:100%}select{max-width:100%}.sticky{position:static}header,main{padding:12px}}
</style></head><body>
<header><h1>Song-by-song playlist review</h1><p id="question"></p><p class="muted">1 Definitely not · 2 Probably not · 3 Borderline · 4 Probably belong · 5 Definitely belong · Unsure</p><details><summary>Full rating guide</summary><div id="rubric"></div></details><nav><button id="prev">← Previous</button><select id="jump" aria-label="Jump to song"></select><button id="next">Next →</button><select id="filter" aria-label="Song filter"><option value="all">All review songs</option><option value="pending">Unsubmitted songs</option></select></nav><p><button id="export">Export ratings and notes CSV</button> <button id="save-all">Save all completed drafts</button></p><div id="draft-summary"></div><div id="progress"></div><div id="status" role="status" aria-live="polite"></div></header>
<main><div class="sticky"><section class="query" id="anchor"></section><section id="player" hidden><strong id="playing"></strong><audio id="shared-audio" controls preload="none"></audio></section></div><div id="list"></div><footer><button id="submit">Submit complete packet</button><span class="muted" id="packet-progress"></span><label id="reason-label" hidden>Reason for revising a submitted packet<textarea id="reason" maxlength="2000"></textarea></label></footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id),node=(tag,value)=>{const n=document.createElement(tag);n.textContent=value;return n};
let packets=[],rubric={},index=0,frozen=false,busy=false,answers={},playback={};
const sessionId=crypto.randomUUID(),draftKey=p=>'playlist-compact-draft:'+p.packet_id;
function notice(message){$('status').textContent=message}
function draft(packet){if(frozen)return Object.fromEntries(packet.answers.map(a=>[a.pair_id,{...a}]));let saved;try{saved=JSON.parse(sessionStorage.getItem(draftKey(packet))||'null')}catch{}return saved||Object.fromEntries(packet.answers.map(a=>[a.pair_id,{...a}]))}
function saveDraft(){try{sessionStorage.setItem(draftKey(packets[index]),JSON.stringify(answers));notice('Draft saved in this tab. Submit the complete packet when ready.')}catch{notice('Draft kept until you leave this page. Submit the complete packet to save.')}updateControls();draftSummary()}
function updateControls(){const p=packets[index];const count=p.candidates.filter(c=>answers[c.pair_id]?.label).length;$('packet-progress').textContent=`${count}/${p.candidates.length} candidates judged${p.submitted?' · Previously submitted':''}`;$('submit').disabled=frozen||busy;$('submit').textContent=p.submitted?'Save revised packet':'Submit complete packet'}
function monitor(audio,track){playback[track.spotify_track_id]??={track_id:track.spotify_track_id,played_seconds:0,seek_count:0};let last=null;audio.onplay=()=>document.querySelectorAll('audio').forEach(a=>{if(a!==audio)a.pause()});audio.ontimeupdate=()=>{if(last!==null&&!audio.paused&&!audio.seeking){const delta=audio.currentTime-last;if(delta>0&&delta<2)playback[track.spotify_track_id].played_seconds+=delta}last=audio.currentTime};audio.onseeking=()=>{last=null;playback[track.spotify_track_id].seek_count++}}
function render(){document.querySelectorAll('audio').forEach(a=>a.pause());$('player').hidden=true;$('shared-audio').removeAttribute('src');$('shared-audio').load();playback={};const p=packets[index];$('anchor').replaceChildren();$('list').replaceChildren();if(!p){notice('No review packets.');$('submit').disabled=true;return}answers=draft(p);$('jump').replaceChildren(...packets.map((p,i)=>new Option(`${i+1}. ${p.anchor.title} — ${p.anchor.artists.join(', ')}`,i)));$('jump').value=index;$('prev').disabled=busy||index===0;$('next').disabled=busy||index===packets.length-1;$('progress').textContent=`Review song ${index+1}/${packets.length} · ${packets.filter(p=>p.submitted).length}/${packets.length} packets submitted`;
const title=document.createElement('div');title.append(node('small','ANCHOR SONG'),node('h2',p.anchor.title),node('div',p.anchor.artists.join(', ')));const audio=document.createElement('audio');audio.controls=true;audio.preload='metadata';audio.src=p.anchor.audio_url;audio.setAttribute('aria-label','Anchor audio');monitor(audio,p.anchor);$('anchor').append(title,audio);
for(const c of p.candidates){const row=document.createElement('article');row.dataset.pair=c.pair_id;const identity=document.createElement('div');identity.append(node('h2',c.track.title));const artist=node('div',c.track.artists.join(', '));artist.className='artists';identity.append(artist);row.append(identity);
const play=node('button','▶ Play');play.className='play';play.setAttribute('aria-label','Play '+c.track.title);play.onclick=()=>{const a=$('shared-audio');a.pause();$('player').hidden=false;$('playing').textContent=c.track.title+' — '+c.track.artists.join(', ');a.src=c.track.audio_url;monitor(a,c.track);a.play().catch(()=>notice('Use the audio controls to start playback.'))};row.append(play);
const ratings=document.createElement('div');ratings.className='ratings';const note=document.createElement('textarea');note.placeholder='Optional note';note.maxLength=2000;note.setAttribute('aria-label','Note for '+c.track.title);note.value=answers[c.pair_id]?.note||'';note.hidden=!note.value;note.disabled=frozen||busy;note.oninput=()=>{answers[c.pair_id]??={pair_id:c.pair_id,label:'',note:''};answers[c.pair_id].note=note.value;saveDraft()};
for(const label of ['1','2','3','4','5','UNSURE','']){const b=node('button',label==='UNSURE'?'Unsure':label||'×');b.dataset.label=label;b.title=label?rubric[label]:'Clear draft choice';b.setAttribute('aria-label',label?`${label}: ${rubric[label]} — ${c.track.title}`:'Clear choice for '+c.track.title);b.setAttribute('aria-pressed',String(Boolean(label)&&answers[c.pair_id]?.label===label));b.disabled=frozen||busy;b.onclick=()=>{answers[c.pair_id]={pair_id:c.pair_id,label,note:note.value};ratings.querySelectorAll('[data-label]').forEach(btn=>btn.setAttribute('aria-pressed',String(Boolean(label)&&btn.dataset.label===label)));saveDraft()};ratings.append(b)}
const toggle=node('button','Note');toggle.onclick=()=>{note.hidden=!note.hidden;if(!note.hidden)note.focus()};ratings.append(toggle);row.append(ratings,note);$('list').append(row)}
$('reason-label').hidden=!p.submitted;$('reason').value='';notice(frozen?'Review is frozen.':p.submitted?'Packet submitted. Changes require a revision reason.':'Choose a judgment for each candidate, then submit the packet.');updateControls()}
async function load(){const first=await fetch('/api/session?offset=0&limit=10');if(!first.ok)throw Error('Cannot load review');const data=await first.json();packets=data.packets;rubric=data.rubric;frozen=data.frozen;for(let offset=10;offset<data.total;offset+=10){const r=await fetch('/api/session?offset='+offset+'&limit=10');if(!r.ok)throw Error('Cannot load review');packets.push(...(await r.json()).packets)}$('question').textContent=data.question;$('rubric').replaceChildren(...Object.entries(rubric).map(([k,v])=>node('p',k+' — '+v)));render();draftSummary()}
function move(delta){if(busy)return;for(let next=index+delta;next>=0&&next<packets.length;next+=delta){if($('filter').value==='all'||!packets[next].submitted){index=next;render();return}}notice('No more matching songs in that direction.')}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('jump').onchange=()=>{if(!busy){index=Number($('jump').value);render()}};$('filter').onchange=()=>{if(busy)return;if($('filter').value==='pending'){const next=packets.findIndex(p=>!p.submitted);if(next<0){notice('Every packet has been submitted.');return}index=next}render()};
$('submit').onclick=async()=>{if(busy||frozen)return;const p=packets[index];const submitted=p.candidates.map(c=>answers[c.pair_id]);if(submitted.some(a=>!a?.label)){notice('Choose a judgment for every candidate before submitting.');return}busy=true;updateControls();$('jump').disabled=true;$('filter').disabled=true;try{const r=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({packet_id:p.packet_id,answers:submitted,revision_reason:$('reason').value,session_id:sessionId,playback:Object.values(playback)})});const result=await r.json();if(!r.ok)throw Error(result.error);sessionStorage.removeItem(draftKey(p));await load();notice('Complete packet saved.')}catch(e){notice(e.message)}finally{busy=false;$('jump').disabled=false;$('filter').disabled=false;$('prev').disabled=index===0;$('next').disabled=index===packets.length-1;updateControls()}};
function draftSummary(){
const pending=packets.filter(p=>!p.submitted),complete=pending.filter(p=>p.candidates.every(c=>draft(p)[c.pair_id]?.label));
$('draft-summary').textContent=`${complete.length} completed drafts ready to save · ${pending.length-complete.length} packets still need judgments`;
$('save-all').disabled=busy||frozen||!complete.length;
}
function csvCell(value){let text=String(value??'');if(/^[=+@\-\t\r]/.test(text))text="'"+text;return '"'+text.replaceAll('"','""')+'"'}
$('export').onclick=()=>{
const rows=[['packet_id','pair_id','anchor','anchor_artists','candidate','candidate_artists','rating','note','save_status']];
for(const p of packets){const values=draft(p);for(const c of p.candidates){const a=values[c.pair_id]||{},prior=p.answers.find(x=>x.pair_id===c.pair_id);
const saved=p.submitted&&prior&&String(prior.label)===String(a.label)&&(prior.note||'')===(a.note||'');
rows.push([p.packet_id,c.pair_id,p.anchor.title,p.anchor.artists.join('; '),c.track.title,c.track.artists.join('; '),a.label||'',a.note||'',saved?'SUBMITTED':'DRAFT']);}}
const blob=new Blob(['\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n')+'\r\n'],{type:'text/csv;charset=utf-8'});
const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='playlist-review-ratings-and-notes.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
$('save-all').onclick=async()=>{
if(busy||frozen)return;
const ready=packets.filter(p=>!p.submitted&&p.candidates.every(c=>draft(p)[c.pair_id]?.label));
busy=true;document.querySelectorAll('article button, article textarea').forEach(e=>e.disabled=true);updateControls();draftSummary();$('jump').disabled=true;$('filter').disabled=true;
let saved=0,error='';
try{for(const p of ready){
const values=draft(p),submitted=p.candidates.map(c=>values[c.pair_id]);
const response=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({packet_id:p.packet_id,answers:submitted,revision_reason:'',session_id:sessionId,playback:p===packets[index]?Object.values(playback):[]})});
const result=await response.json();if(!response.ok)throw Error(result.error||'Save failed');
p.submitted=true;p.answers=submitted;sessionStorage.removeItem(draftKey(p));saved++;notice(`Saved ${saved}/${ready.length} completed drafts.`);
}}catch(e){error=e.message}finally{
busy=false;$('jump').disabled=false;$('filter').disabled=false;
try{await load()}catch(e){error=error||e.message;render();draftSummary()}
notice(`Saved ${saved} completed packets.${error?' Stopped: '+error:' Incomplete drafts and revisions to submitted packets remain unchanged.'}`);
}
};
window.addEventListener('beforeunload',()=>document.querySelectorAll('audio').forEach(a=>a.pause()));load().catch(e=>notice(e.message));
</script></body></html>
