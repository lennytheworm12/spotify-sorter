<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Stage 4A listening review</title><style>
:root{font-family:system-ui,sans-serif;color:#eee;background:#101314}body{max-width:900px;margin:0 auto;padding:24px}h1{font-size:1.5rem}.card{background:#1b2022;border:1px solid #394247;border-radius:12px;padding:20px;margin:18px 0}.players{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.player{background:#252c2f;padding:12px;border-radius:8px}.player button{width:100%;min-height:44px}.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.choices button{min-width:90px;min-height:44px}.selected{outline:3px solid #58d68d}label,input{font-size:1rem}input{padding:8px}#status{min-height:1.5em;color:#9fe3b9}@media(max-width:650px){.players{grid-template-columns:1fr}}
</style></head><body><h1>Stage 4A listening review</h1><p>Considering the available 30-second recordings overall, which candidate sounds more like the query?</p><label>Designated reviewer <input id="reviewer" autocomplete="off"></label> <button id="load">Load</button><p id="status" role="status" aria-live="polite"></p><main id="trials"></main><script>
let session,activeAudio=null;const status=document.querySelector('#status');
function stopActive(){if(activeAudio){activeAudio.pause();activeAudio.currentTime=0;activeAudio=null}document.querySelectorAll('.play').forEach(x=>x.textContent='Play')}
function player(label,url){const box=document.createElement('div');box.className='player';const title=document.createElement('strong');title.textContent=label;const audio=new Audio(url);audio.preload='none';const button=document.createElement('button');button.className='play';button.textContent='Play';button.onclick=()=>{if(activeAudio===audio){stopActive();return}stopActive();activeAudio=audio;button.textContent='Stop';audio.play()};audio.onended=()=>stopActive();box.append(title,document.createElement('br'),button);return box}
async function save(trial,choice,buttons){const response=await fetch('/api/rating',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({trial_id:trial.trial_id,reviewer_id:session.reviewer_id,choice})});const data=await response.json();if(!response.ok)throw Error(data.error);buttons.forEach(x=>x.classList.toggle('selected',x.textContent===choice));status.textContent='Saved '+trial.trial_id}
function render(){const main=document.querySelector('#trials');main.replaceChildren();session.trials.forEach((trial,index)=>{const card=document.createElement('section');card.className='card';const heading=document.createElement('h2');heading.textContent=`Trial ${index+1} of ${session.trials.length}`;const players=document.createElement('div');players.className='players';players.append(player('Query',trial.query_audio),player('Candidate A',trial.a_audio),player('Candidate B',trial.b_audio));const choices=document.createElement('div');choices.className='choices';const buttons=session.choices.map(choice=>{const b=document.createElement('button');b.textContent=choice;b.classList.toggle('selected',trial.current_reviewer.choice===choice);b.onclick=()=>save(trial,choice,buttons).catch(e=>status.textContent=e.message);choices.append(b);return b});card.append(heading,players,choices);main.append(card)});status.textContent=`${session.progress.rated} of ${session.progress.total} rated`}
document.querySelector('#load').onclick=async()=>{try{const id=document.querySelector('#reviewer').value;const response=await fetch('/api/session?reviewer='+encodeURIComponent(id));const data=await response.json();if(!response.ok)throw Error(data.error);session=data;render()}catch(e){status.textContent=e.message}};
</script></body></html>
