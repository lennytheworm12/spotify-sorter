candidate_policy:
  exclude_all_query_ids: true
  exclude_same_artist: false
  duplicate_rules: [same_track_id, identical_source_sha256, identical_canonical_30s_pcm_sha256, identical_center5_v1_pcm_sha256]
  forbidden_duplicate_inputs: [laion_clap_score, mert_5120_score, muq_mulan_large_score]
  retrieval_metric: exact_cosine
  normalization: l2
  initial_depth: 30
  single_expansion_depth: 50
  expansion_timing: before_labels

split:
  counts: {TRAIN: 16, VALIDATION: 8, TEST: 16}
  per_genre: {TRAIN: 2, VALIDATION: 1, TEST: 2}
  artist_normalization: unicode_nfkc_casefold_whitespace
  group_first: true
  tie_break: seeded_sha256

trials:
  source_pairs:
    - [laion_clap, mert_5120]
    - [laion_clap, muq_mulan_large]
    - [mert_5120, muq_mulan_large]
  strict_disagreements_per_pair_query: 2
  source_balance_min_ratio: 0.90
  pair_deduplicate_within_query: true
  orientation: sha256_seed_plus_canonical_trial_identity
  trial_ids: opaque
  anchors_enter_fit: false

ratings:
  question: Which candidate sounds more like the query overall?
  choices: [A, B, Tie, Neither]
  rater_id: required_normalized_nonempty
  required_distinct_raters_per_trial: 1
  train_validation:
    initial_distinct_raters: 1
    third_on_exact_disagreement: false
    maximum_distinct_raters: 1
  test:
    distinct_raters: 1
  canonical_label: single_reviewer_latest_choice
  binary_denominator: A_or_B_single_reviewer_only
  preserve_ambiguity: true
  additional_raters: optional_external_replication_only

selection:
  permitted_representation_sets:
    - [laion_clap]
    - [mert_5120]
    - [muq_mulan_large]
    - [laion_clap, mert_5120]
    - [laion_clap, muq_mulan_large]
    - [mert_5120, muq_mulan_large]
    - [laion_clap, mert_5120, muq_mulan_large]
  single_baselines: native_cosine_margin_unscaled_unsupervised
  fusion_model:
    implementation: sklearn.linear_model.LogisticRegression
    penalty: l2
    solver: lbfgs
    fit_intercept: false
    C_grid: [0.01, 0.1, 1, 10, 100]
  scaling_fit_split: TRAIN
  hyperparameter_selection_split: VALIDATION
  primary_metric: query_macro_accuracy
  zero_margin_accuracy_credit: 0.5
  C_practical_tie: 0.005
  C_tiebreak: [lower_log_loss, smaller_C]
  fusion_subset_practical_tie: 0.01
  fusion_subset_tiebreak: [fewer_encoders, lower_log_loss, canonical_subset_order]
  equal_weight_three_encoder: diagnostic_only
  test_lock:
    require_selection_tracked_clean_committed_pushed: true
    refuse_existing_test_output: true
    test_identity_hash_only_before_reveal: true

uncertainty:
  interpretation: query_variation_for_this_single_reviewers_preferences
  paired_query_bootstrap_draws: 50000
  coefficient_query_bootstrap_refits: 2000
  confidence: 0.95

verdict:
  allowed: [FUSION_WINS, SINGLE_ENCODER_WINS, STATISTICALLY_EQUIVALENT_PICK_SIMPLER, INSUFFICIENT_HUMAN_EVIDENCE]
  fusion_min_improvement: 0.02
  confidence_lower_bound_must_exceed_zero: true
  insufficiency_protocol_only: true
  protocol_failures: [source_balance, incomplete_single_reviewer_ratings, split_or_query_coverage_loss, test_query_without_ab_choice]
  claim_scope: single_reviewer_personal_perceptual_alignment

paths:
  audio_root: data/fma/fma_small
  pcm_identity_cache: data/holistic_stage2b_pcm_cache
  report_dir: reports/holistic_stage2b
