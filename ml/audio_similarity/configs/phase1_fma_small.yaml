# Phase 1 experiment config (Phase 1 design doc, section 21).
# Values marked <PIN> are captured automatically into run provenance
# metadata by audio_similarity.merit_encoder.ModelProvenance.
experiment_id: merit_fma_small_v1

dataset:
  name: fma_small
  manifest: data/manifests/fma_small.parquet

audio:
  sample_rate: 24000
  mono: true
  target_seconds: 30
  preprocessing_version: pp-v1

model:
  backbone: m-a-p/MERT-v1-330M
  backbone_revision: <PIN>          # recorded at runtime from HF hub sha
  merit_repo: amaai-lab/merit
  merit_revision: <PIN>             # recorded at runtime from HF hub sha
  head_sha256:                      # recorded at runtime before loading
    melody: <PIN>
    rhythm: <PIN>
    timbre: <PIN>
  extract_layers: [3, 4, 5, 6, 23]

encode:
  batch_size: 1                     # correctness reference; benchmark larger later
  checkpoint_every: 10

retrieval:
  metric: cosine
  k: [5, 10, 20]
  exact: true                       # no ANN in Phase 1
  representations:
    - melody
    - rhythm
    - timbre
    - mert_general
    - conventional_features

evaluation:
  query_manifest: data/eval/phase1_queries.csv
  query_count: 24                   # 3 queries x 8 FMA top-level genres
  neighbors_per_factor: 5
  seed: 20260822
